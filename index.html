<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SG Subzone Population Choropleth</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; }
    body { font-family: sans-serif; }
    h1 { text-align:center; margin:16px 0; }
    #map { width:100vw; height:90vh; position:relative; }
    #tooltip {
      position:absolute; display:none;
      background:rgba(255,255,255,0.9); border:1px solid #999;
      padding:4px 8px; pointer-events:none; font-size:13px;
    }
    .legend text { font-size:12px; }
  </style>
</head>
<body>
  <h1>Singapore Population by Subzone (2024)</h1>
  <div id="map"></div>
  <div id="tooltip"></div>

  <script>
    // 1. SVG & projection setup
    const container = d3.select('#map'),
          width     = container.node().clientWidth,
          height    = container.node().clientHeight;

    const svg = container.append('svg')
      .attr('width', width)
      .attr('height', height);

    const projection = d3.geoMercator()
      .center([103.8,1.35]).scale(1).translate([0,0]);
    const path = d3.geoPath().projection(projection);

    // 2. Load GeoJSON + CSV
    Promise.all([
      d3.json('sgmap.json'),
      d3.csv('Population_by_Subzone.csv', d => {
        const zone = d['SUBZONE UPPER']?.trim();
        if (!zone || zone.toUpperCase() === 'TOTAL') return null;
        const raw = d['Population'].trim();
        return {
          name: zone.toUpperCase(),
          pop: raw === '-' ? null : +raw.replace(/\s+/g,'')
        };
      })
    ]).then(([geojson, raw]) => {
      // 3. Prepare data & quantize scale
      const popData   = raw.filter(d => d && d.pop != null),
            pops      = popData.map(d => d.pop),
            popByName = new Map(popData.map(d => [d.name, d.pop]));

      const color = d3.scaleQuantize()
        .domain(d3.extent(pops))
        .range(d3.schemeOrRd[7]);

      // build buckets [start,end,color]
      const thresholds = color.thresholds(),
            domain     = d3.extent(pops),
            buckets    = color.range().map((c,i) => {
              const start = i===0 ? domain[0] : thresholds[i-1],
                    end   = i < thresholds.length ? thresholds[i] : domain[1];
              return { start, end, color: c };
            });

      // 4. Inject population into features
      geojson.features.forEach(f => {
        const key = f.properties['Subzone Name'].trim().toUpperCase();
        f.properties.population = popByName.get(key) || null;
      });

      // 5. Fit projection to data bounds
      const b = path.bounds(geojson),
            s = 0.95 / Math.max(
                  (b[1][0]-b[0][0]) / width,
                  (b[1][1]-b[0][1]) / height
            ),
            t = [
              (width  - s*(b[1][0]+b[0][0]))/2,
              (height - s*(b[1][1]+b[0][1]))/2
            ];
      projection.scale(s).translate(t);

      // 6. Draw choropleth
      svg.append('g')
        .selectAll('path')
        .data(geojson.features)
        .join('path')
          .attr('d', path)
          .attr('fill', d => d.properties.population != null ? color(d.properties.population) : '#eee')
          .attr('stroke','#444')
          .attr('stroke-width',0.8)
          .on('mouseover', (e,d)=> {
            const name = d.properties['Subzone Name'],
                  v    = d.properties.population;
            d3.select('#tooltip')
              .style('left',  (e.pageX+6)+'px')
              .style('top',   (e.pageY+6)+'px')
              .html(`<strong>${name}</strong><br/>Population: ${v!=null?v.toLocaleString():'n/a'}`)
              .style('display','block');
          })
          .on('mouseout', () =>
            d3.select('#tooltip').style('display','none')
          );

      // 7. Vertical legend in bottom-left corner with title
      const boxW     = 40,
            boxH     = 12,
            vGap     = 6,
            margin   = 20,
            legendH  = buckets.length * (boxH + vGap) - vGap,
            legendX  = margin,
            legendY  = height - legendH - margin;

      const legend = svg.append('g')
        .attr('class','legend')
        .attr('transform', `translate(${legendX},${legendY})`);

      // title
      legend.append('text')
        .attr('x', 0)
        .attr('y', - (boxH + vGap))
        .text('Legend: Population Count')
        .attr('font-weight','bold')
        .attr('font-size','12px');

      // colored boxes
      legend.selectAll('rect')
        .data(buckets)
        .join('rect')
          .attr('x', 0)
          .attr('y', (_,i) => i * (boxH + vGap))
          .attr('width', boxW)
          .attr('height', boxH)
          .attr('fill', d => d.color)
          .attr('stroke','#333')
          .attr('stroke-width',0.3);

      // labels
      legend.selectAll('text.bucket')
        .data(buckets)
        .join('text')
          .attr('class','bucket')
          .attr('x', boxW + 6)
          .attr('y', (_,i) => i * (boxH + vGap) + boxH - 2)
          .text(d => `${d3.format(',')(Math.round(d.start))} – ${d3.format(',')(Math.round(d.end))}`);
    })
    .catch(err => {
      console.error('Load error:', err);
      alert('Couldn’t load sgmap.json or CSV—check filenames & paths.');
    });
  </script>
</body>
</html>
